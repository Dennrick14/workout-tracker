/* Layout and responsive overflow fixes */
html,body{width:100%;max-width:100%;overflow-x:hidden}
.shell,.grid,.card,#foodGroups,.foodgroup,.foodrow{min-width:0;max-width:100%}
.calendar{width:100%;min-width:0;grid-template-columns:repeat(7,minmax(0,1fr))}
.day{min-width:0}
.foodrow{display:grid;grid-template-columns:28px 28px 18px minmax(90px,1fr) 28px 88px 52px 48px 36px;gap:8px;align-items:center;padding:10px 12px}
.foodrow>input[type=checkbox]{width:16px;height:16px;margin:0;justify-self:center}
.foodrow .foodname{min-width:0;overflow-wrap:anywhere}
.foodrow .mono{white-space:nowrap;text-align:center}

.foodrow .protein{white-space:nowrap;text-align:right}

.foodhead{gap:10px;min-width:0}
.foodhead>div{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}

@media(max-width:560px){

@media(max-width:560px){

}

.day.selected.protein-hit{background:#29452e;border-color:var(--lime)}
.day.selected.protein-mid{background:#554626;border-color:var(--lime)}
.day.selected.protein-low{background:#542c2c;border-color:var(--lime)}

#calendar .day.protein-hit,
#calendar .day.selected.protein-hit{background-color:#29452e!important;border-color:#4f7e4d!important}
